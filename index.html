<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Naturally</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#fff;scroll-behavior:smooth}

/* NAVBAR */
nav{
position:fixed;top:0;width:100%;padding:15px 30px;
display:flex;justify-content:space-between;align-items:center;
background:transparent;transition:.4s;z-index:1000
}
nav.scrolled{background:#f6c1cc;box-shadow:0 5px 15px rgba(0,0,0,.15)}
.logo{font-size:26px;font-weight:bold;color:white}
.menu-btn{display:none;font-size:26px;color:white}
ul{list-style:none;display:flex}
ul li{margin-left:20px}
ul li a{color:white;text-decoration:none}

/* HERO */
.hero{
height:65vh;
background:linear-gradient(120deg,#f08aa1,#f6c1cc);
display:flex;justify-content:center;align-items:center;
text-align:center;color:white
}
.hero h1{font-size:42px}
.hero p{font-size:18px;margin-top:10px}

/* FILTER */
.filter{
display:flex;justify-content:center;gap:15px;margin-bottom:40px
}
.filter button{
padding:8px 20px;border:none;border-radius:20px;
background:#f08aa1;color:white;cursor:pointer
}
.filter button:hover{background:#e66b89}

/* PRODUCTS */
section{padding:90px 40px;text-align:center}
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:35px
}
.card{
background:white;border-radius:22px;overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.12);
transition:.4s;position:relative
}
.card:hover{transform:translateY(-12px)}
.card img{
width:100%;height:220px;object-fit:cover;
transition:.5s
}
.card:hover img{transform:scale(1.1)}
.wishlist{
position:absolute;top:15px;right:15px;
font-size:22px;cursor:pointer;color:#fff
}
.info{padding:18px}
.info p{font-weight:600}
.info span{color:#777}
.info button{
margin-top:12px;padding:8px 22px;
border:none;background:#f08aa1;color:white;
border-radius:20px;cursor:pointer
}

/* MODAL */
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.6);display:none;
justify-content:center;align-items:center;z-index:2000
}
.modal-content{
background:white;width:320px;border-radius:20px;
overflow:hidden;animation:zoom .3s
}
.modal-content img{width:100%;height:200px;object-fit:cover}
.modal-content div{padding:15px}
@keyframes zoom{from{transform:scale(.6)}to{transform:scale(1)}}

/* SCROLL TOP */
#topBtn{
position:fixed;bottom:25px;right:25px;
padding:10px 14px;border:none;border-radius:50%;
background:#f08aa1;color:white;font-size:18px;
cursor:pointer;display:none
}

/* DARK MODE */
.dark{background:#1f1f1f;color:white}
.dark .card{background:#2b2b2b}
.dark .modal-content{background:#2b2b2b;color:white}

/* RESPONSIVE */
@media(max-width:768px){
ul{display:none}
.menu-btn{display:block}
}
</style>
</head>

<body>

<nav id="navbar">
<div class="logo">Glow Naturally</div>
<div class="menu-btn">☰</div>
<ul>
<li><a href="#products">Products</a></li>
<li><a href="#about">About</a></li>
</ul>
</nav>

<div class="hero">
<div>
<h1>Glow Naturally ✨</h1>
<p>Premium Skincare Collection</p>
</div>
</div>

<section id="products">
<h2 style="color:#f08aa1;margin-bottom:25px">Our Products</h2>

<div class="filter">
<button onclick="filter('all')">All</button>
<button onclick="filter('serum')">Serum</button>
<button onclick="filter('moist')">Moisturizer</button>
<button onclick="filter('sun')">Sunscreen</button>
</div>

<div class="products">

<div class="card serum">
<div class="wishlist">❤</div>
<img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be">
<div class="info">
<p>Vitamin C Serum</p>
<span>₹799</span><br>
<button onclick="openModal(this)">Quick View</button>
</div>
</div>

<div class="card moist">
<div class="wishlist">❤</div>
<img src="https://images.unsplash.com/photo-1615397349754-cfa2066a298e">
<div class="info">
<p>Hydrating Moisturizer</p>
<span>₹599</span><br>
<button onclick="openModal(this)">Quick View</button>
</div>
</div>

<div class="card sun">
<div class="wishlist">❤</div>
<img src="https://images.unsplash.com/photo-1598662972299-5408ddb8a3dc">
<div class="info">
<p>Sunscreen SPF 50</p>
<span>₹499</span><br>
<button onclick="openModal(this)">Quick View</button>
</div>
</div>

</div>
</section>

<section id="about">
<h2 style="color:#f08aa1">About Us</h2>
<p>Minimal • Clean • Dermatologist Tested 💗</p>
</section>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">
<div class="modal-content">
<img id="modalImg">
<div>
<h3 id="modalName"></h3>
<p>Premium skincare for glowing skin ✨</p>
</div>
</div>
</div>

<button id="topBtn" onclick="scrollTop()">↑</button>

<script>
window.addEventListener("scroll",()=>{
navbar.classList.toggle("scrolled",scrollY>50)
topBtn.style.display=scrollY>300?"block":"none"
})

function filter(cat){
let cards=document.querySelectorAll(".card")
cards.forEach(c=>{
c.style.display=(cat=="all"||c.classList.contains(cat))?"block":"none"
})
}

function openModal(btn){
let card=btn.closest(".card")
modal.style.display="flex"
modalImg.src=card.querySelector("img").src
modalName.innerText=card.querySelector("p").innerText
}

function closeModal(){modal.style.display="none"}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
</script>

</body>
</html>
